name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  identity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, mbstring, zip, bcmath
          tools: composer
      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: php artisan test
  moderation-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/moderation-service
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, mbstring, zip, bcmath
          tools: composer
      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: php artisan test
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  docker-build:
    runs-on: ubuntu-latest
    needs: [identity-tests, moderation-tests, frontend-build]
    strategy:
      matrix:
        include:
          - { name: api-gateway, context: ./api-gateway, file: ./api-gateway/Dockerfile }
          - { name: identity-service, context: ., file: ./Dockerfile }
          - { name: moderation-service, context: ./services/moderation-service, file: ./services/moderation-service/Dockerfile }
          - { name: chat-service, context: ./services/chat-service, file: ./services/chat-service/Dockerfile }
          - { name: event-processor, context: ./services/event-processor, file: ./services/event-processor/Dockerfile }
          - { name: frontend, context: ./frontend, file: ./frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: iteh-${{ matrix.name }}:ci
  integration-smoke:
    runs-on: ubuntu-latest
    needs: [docker-build]
    env:
      APP_KEY: base64:2fl+Ktvk6xqzLb0f5nW0LhYJ3Jb0f5nW0LhYJ3Jb0f5nW=
      MODERATION_APP_KEY: base64:2fl+Ktvk6xqzLb0f5nW0LhYJ3Jb0f5nW0LhYJ3Jb0f5nW=
      INTERNAL_API_KEY: internal-ci-key
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build kafka postgres-identity postgres-moderation mongodb identity-service moderation-service chat-service event-processor api-gateway
      - run: bash scripts/ci/smoke-test.sh
      - if: failure()
        run: docker compose logs --tail=80
      - if: always()
        run: docker compose down -v --remove-orphans
