# Docker embedded DNS — re-resolve servise posle restarta kontejnera
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    client_max_body_size 20M;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # CORS — dozvoljen samo frontend origin
    set $cors_origin "";
    if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1):3000$") {
        set $cors_origin $http_origin;
    }
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-XSRF-TOKEN, X-Requested-With" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # Sanctum CSRF (Anti-CSRF token)
    location /sanctum/ {
        set $upstream_identity identity-service:8001;
        proxy_pass http://$upstream_identity;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # Identity Service — auth i stats
    location ~ ^/api/(register|login|logout|user|stats|health)$ {
        set $upstream_identity identity-service:8001;
        proxy_pass http://$upstream_identity;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Moderation Service — suspend MORA biti pre opšteg korisnik pravila
    location ~ ^/api/korisnik/[0-9]+/suspend$ {
        set $upstream_moderation moderation-service:8002;
        proxy_pass http://$upstream_moderation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/api/(uloga|korisnik) {
        set $upstream_identity identity-service:8001;
        proxy_pass http://$upstream_identity;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/api/(prijava|sankcija) {
        set $upstream_moderation moderation-service:8002;
        proxy_pass http://$upstream_moderation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Chat Service
    location ~ ^/api/(chat|poruka|datoteka) {
        set $upstream_chat chat-service:8003;
        proxy_pass http://$upstream_chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
}
