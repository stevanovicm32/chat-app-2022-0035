openapi: 3.0.0
info:
  title: Chat API
  description: REST API za Chat aplikaciju – autentifikacija, korisnici, chatovi, poruke. Laravel Sanctum za zaštitu endpointa.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Lokalni backend

paths:
  /api/register:
    post:
      tags: [Auth]
      summary: Registracija novog korisnika
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, lozinka, idUloga]
              properties:
                email:
                  type: string
                  format: email
                  example: korisnik@example.com
                lozinka:
                  type: string
                  minLength: 6
                idUloga:
                  type: integer
                  example: 3
      responses:
        '201':
          description: Uspešna registracija
        '422':
          description: Validaciona greška

  /api/login:
    post:
      tags: [Auth]
      summary: Prijava korisnika
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, lozinka]
              properties:
                email:
                  type: string
                  format: email
                lozinka:
                  type: string
      responses:
        '200':
          description: Uspešna prijava, vraća token i podatke korisnika
        '401':
          description: Neispravni kredencijali
        '422':
          description: Validaciona greška

  /api/logout:
    post:
      tags: [Auth]
      summary: Odjava korisnika
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: Uspešna odjava
        '401':
          description: Neautorizovan

  /api/user:
    get:
      tags: [Auth]
      summary: Trenutno ulogovan korisnik
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: Podaci korisnika
        '401':
          description: Neautorizovan

  /api/stats:
    get:
      tags: [Admin]
      summary: Statistika aplikacije (korisnici po ulozi, ukupno chatova, poruka)
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: Statistika – korisniciPoUlozi, ukupnoKorisnika, ukupnoChatova, ukupnoPoruka
        '401':
          description: Neautorizovan

  /api/uloga:
    get:
      tags: [Uloga]
      summary: Lista uloga
      responses:
        '200':
          description: Lista svih uloga
    post:
      tags: [Uloga]
      summary: Kreiranje uloge
      security: [{ sanctum: [] }]
      responses:
        '201':
          description: Uloga kreirana
        '401':
          description: Neautorizovan

  /api/uloga/{uloga}:
    get:
      tags: [Uloga]
      summary: Detalji uloge
      parameters:
        - name: uloga
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji uloge
    put:
      tags: [Uloga]
      summary: Izmena uloge
      security: [{ sanctum: [] }]
      parameters:
        - name: uloga
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Uloga ažurirana
        '401':
          description: Neautorizovan
    patch:
      tags: [Uloga]
      summary: Izmena uloge (partial)
      security: [{ sanctum: [] }]
      parameters:
        - name: uloga
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Uloga ažurirana
        '401':
          description: Neautorizovan
    delete:
      tags: [Uloga]
      summary: Brisanje uloge
      security: [{ sanctum: [] }]
      parameters:
        - name: uloga
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Uloga obrisana
        '401':
          description: Neautorizovan

  /api/korisnik:
    get:
      tags: [Korisnik]
      summary: Lista korisnika
      responses:
        '200':
          description: Lista korisnika
    post:
      tags: [Korisnik]
      summary: Kreiranje korisnika
      security: [{ sanctum: [] }]
      responses:
        '201':
          description: Korisnik kreiran
        '401':
          description: Neautorizovan

  /api/korisnik/{korisnik}:
    get:
      tags: [Korisnik]
      summary: Detalji korisnika
      parameters:
        - name: korisnik
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji korisnika
    put:
      tags: [Korisnik]
      summary: Izmena korisnika
      security: [{ sanctum: [] }]
      parameters:
        - name: korisnik
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Korisnik ažuriran
        '401':
          description: Neautorizovan
    delete:
      tags: [Korisnik]
      summary: Brisanje korisnika
      security: [{ sanctum: [] }]
      parameters:
        - name: korisnik
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Korisnik obrisan
        '401':
          description: Neautorizovan
    patch:
      tags: [Korisnik]
      summary: Izmena korisnika (partial)
      security: [{ sanctum: [] }]
      parameters:
        - name: korisnik
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Korisnik ažuriran
        '401':
          description: Neautorizovan

  /api/korisnik/{korisnik}/lozinka:
    patch:
      tags: [Korisnik]
      summary: Promena lozinke
      security: [{ sanctum: [] }]
      parameters:
        - name: korisnik
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lozinka promenjena
        '401':
          description: Neautorizovan

  /api/korisnik/{korisnik}/suspend:
    patch:
      tags: [Korisnik]
      summary: Suspendovanje korisnika
      security: [{ sanctum: [] }]
      parameters:
        - name: korisnik
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Korisnik suspendovan
        '401':
          description: Neautorizovan

  /api/korisnik/{korisnik}/chatovi:
    get:
      tags: [Pripada]
      summary: Chatovi korisnika
      parameters:
        - name: korisnik
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista chatova korisnika

  /api/chat:
    get:
      tags: [Chat]
      summary: Lista chatova
      responses:
        '200':
          description: Lista chatova
    post:
      tags: [Chat]
      summary: Kreiranje chata
      security: [{ sanctum: [] }]
      responses:
        '201':
          description: Chat kreiran
        '401':
          description: Neautorizovan

  /api/chat/{chat}:
    get:
      tags: [Chat]
      summary: Detalji chata
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji chata
    put:
      tags: [Chat]
      summary: Izmena chata
      security: [{ sanctum: [] }]
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chat ažuriran
        '401':
          description: Neautorizovan
    delete:
      tags: [Chat]
      summary: Brisanje chata
      security: [{ sanctum: [] }]
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chat obrisan
        '401':
          description: Neautorizovan
    patch:
      tags: [Chat]
      summary: Izmena chata (partial)
      security: [{ sanctum: [] }]
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chat ažuriran
        '401':
          description: Neautorizovan

  /api/chat/{chat}/poruka:
    get:
      tags: [Poruka]
      summary: Poruke u chatu
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista poruka
    post:
      tags: [Poruka]
      summary: Slanje poruke u chat
      security: [{ sanctum: [] }]
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Poruka poslata
        '401':
          description: Neautorizovan

  /api/chat/{chat}/poruka/{poruka}:
    get:
      tags: [Poruka]
      summary: Detalji poruke
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji poruke
    put:
      tags: [Poruka]
      summary: Izmena poruke
      security: [{ sanctum: [] }]
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Poruka ažurirana
        '401':
          description: Neautorizovan
    patch:
      tags: [Poruka]
      summary: Izmena poruke (partial)
      security: [{ sanctum: [] }]
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Poruka ažurirana
        '401':
          description: Neautorizovan
    delete:
      tags: [Poruka]
      summary: Brisanje poruke
      security: [{ sanctum: [] }]
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Poruka obrisana
        '401':
          description: Neautorizovan

  /api/chat/{chat}/korisnici:
    get:
      tags: [Pripada]
      summary: Učesnici chata
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista učesnika
    post:
      tags: [Pripada]
      summary: Dodavanje korisnika u chat
      security: [{ sanctum: [] }]
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Korisnik dodat
        '401':
          description: Neautorizovan

  /api/chat/{chat}/korisnici/{korisnik}:
    delete:
      tags: [Pripada]
      summary: Uklanjanje korisnika iz chata
      security: [{ sanctum: [] }]
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: integer
        - name: korisnik
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Korisnik uklonjen
        '401':
          description: Neautorizovan

  /api/poruka:
    get:
      tags: [Poruka]
      summary: Lista poruka
      responses:
        '200':
          description: Lista poruka
    post:
      tags: [Poruka]
      summary: Kreiranje poruke
      security: [{ sanctum: [] }]
      responses:
        '201':
          description: Poruka kreirana
        '401':
          description: Neautorizovan

  /api/poruka/{poruka}:
    get:
      tags: [Poruka]
      summary: Detalji poruke
      parameters:
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji poruke
    put:
      tags: [Poruka]
      summary: Izmena poruke
      security: [{ sanctum: [] }]
      parameters:
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Poruka ažurirana
        '401':
          description: Neautorizovan
    patch:
      tags: [Poruka]
      summary: Izmena poruke (partial)
      security: [{ sanctum: [] }]
      parameters:
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Poruka ažurirana
        '401':
          description: Neautorizovan
    delete:
      tags: [Poruka]
      summary: Brisanje poruke
      security: [{ sanctum: [] }]
      parameters:
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Poruka obrisana
        '401':
          description: Neautorizovan

  /api/poruka/{poruka}/datoteka:
    get:
      tags: [Datoteka]
      summary: Datoteke poruke
      parameters:
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista datoteka
    post:
      tags: [Datoteka]
      summary: Dodavanje datoteke uz poruku
      security: [{ sanctum: [] }]
      parameters:
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Datoteka dodata
        '401':
          description: Neautorizovan

  /api/poruka/{poruka}/datoteka/{datoteka}:
    get:
      tags: [Datoteka]
      summary: Detalji datoteke
      parameters:
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
        - name: datoteka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji datoteke
    put:
      tags: [Datoteka]
      summary: Izmena datoteke
      security: [{ sanctum: [] }]
      parameters:
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
        - name: datoteka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datoteka ažurirana
        '401':
          description: Neautorizovan
    patch:
      tags: [Datoteka]
      summary: Izmena datoteke (partial)
      security: [{ sanctum: [] }]
      parameters:
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
        - name: datoteka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datoteka ažurirana
        '401':
          description: Neautorizovan
    delete:
      tags: [Datoteka]
      summary: Brisanje datoteke
      security: [{ sanctum: [] }]
      parameters:
        - name: poruka
          in: path
          required: true
          schema:
            type: integer
        - name: datoteka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datoteka obrisana
        '401':
          description: Neautorizovan

  /api/datoteka:
    get:
      tags: [Datoteka]
      summary: Lista datoteka
      responses:
        '200':
          description: Lista datoteka
    post:
      tags: [Datoteka]
      summary: Upload datoteke
      security: [{ sanctum: [] }]
      responses:
        '201':
          description: Datoteka uploadovana
        '401':
          description: Neautorizovan

  /api/datoteka/{datoteka}:
    get:
      tags: [Datoteka]
      summary: Detalji datoteke
      parameters:
        - name: datoteka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalji datoteke
    put:
      tags: [Datoteka]
      summary: Izmena datoteke
      security: [{ sanctum: [] }]
      parameters:
        - name: datoteka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datoteka ažurirana
        '401':
          description: Neautorizovan
    patch:
      tags: [Datoteka]
      summary: Izmena datoteke (partial)
      security: [{ sanctum: [] }]
      parameters:
        - name: datoteka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datoteka ažurirana
        '401':
          description: Neautorizovan
    delete:
      tags: [Datoteka]
      summary: Brisanje datoteke
      security: [{ sanctum: [] }]
      parameters:
        - name: datoteka
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datoteka obrisana
        '401':
          description: Neautorizovan

tags:
  - name: Auth
    description: Registracija, prijava, odjava
  - name: Admin
    description: Statistika i admin funkcije
  - name: Uloga
    description: Uloge korisnika
  - name: Korisnik
    description: Korisnici
  - name: Chat
    description: Chatovi
  - name: Poruka
    description: Poruke
  - name: Datoteka
    description: Datoteke uz poruke
  - name: Pripada
    description: Pripadnost chatova korisnicima

components:
  securitySchemes:
    sanctum:
      type: apiKey
      description: Laravel Sanctum Bearer token. Format Bearer <token>
      name: Authorization
      in: header
